<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Mock-up of slice G (squads, the embodied creep, formations) and of slice R's hostile sign. Planned, not in the game yet. -->
  <defs>
    <pattern id="jungle" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#16241c"/>
      <path d="M20 0H0V20" fill="none" stroke="#21352a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e6e8ec"/>
    </marker>
    <!-- the squads' symbols (a player picks one from a list) -->
    <symbol id="star" viewBox="-6 -6 12 12"><path d="M0 -5L1.5 -1.5L5 -1.5L2.2 0.8L3.2 4.5L0 2.3L-3.2 4.5L-2.2 0.8L-5 -1.5L-1.5 -1.5z" fill="#f2f4f8"/></symbol>
    <symbol id="hex" viewBox="-6 -6 12 12"><path d="M0 -5L4.3 -2.5V2.5L0 5L-4.3 2.5V-2.5z" fill="#f2f4f8"/></symbol>
  </defs>
  <rect width="960" height="420" fill="#111317"/>

  <!-- the map -->
  <rect x="16" y="16" width="660" height="388" rx="6" fill="url(#jungle)" stroke="#4a4e57"/>
  <path d="M16 300H360V320H16z" fill="#b8a07a" opacity="0.85"/>
  <path d="M520 16V120H560V16z" fill="#2f3238"/>
  <rect x="16" y="10" width="86" height="22" rx="11" fill="#ffd166"/>
  <text x="59" y="25.5" text-anchor="middle" font-size="12" font-weight="700" fill="#111317" letter-spacing="1">MOCK-UP</text>

  <!-- Ana's squad (★), moving right in the default formation:
       squares in front, triangles in the middle and on the flanks, circles behind -->
  <path d="M330 210H420" stroke="#e6e8ec" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#tip)" opacity="0.7"/>
  <g stroke="#0d0f12" stroke-width="1.5">
    <rect x="292" y="172" width="18" height="18" fill="#4ea8ff"/>
    <rect x="292" y="230" width="18" height="18" fill="#4ea8ff"/>
    <path d="M262 150L244 140L244 160z" fill="#4ea8ff"/>
    <path d="M262 270L244 260L244 280z" fill="#4ea8ff"/>
    <circle cx="200" cy="180" r="9" fill="#4ea8ff"/>
    <circle cx="200" cy="240" r="9" fill="#4ea8ff"/>
  </g>
  <!-- the embodied creep: a glow and the player's name, seen by everyone -->
  <circle cx="254" cy="210" r="18" fill="#ffffff" opacity="0.55" filter="url(#glow)"/>
  <path d="M266 210L244 198L244 222z" fill="#4ea8ff" stroke="#ffffff" stroke-width="2"/>
  <text x="254" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Ana</text>
  <g>
    <use href="#star" x="306" y="164" width="10" height="10"/>
    <use href="#star" x="306" y="222" width="10" height="10"/>
    <use href="#star" x="258" y="132" width="10" height="10"/>
    <use href="#star" x="258" y="252" width="10" height="10"/>
    <use href="#star" x="206" y="166" width="10" height="10"/>
    <use href="#star" x="206" y="226" width="10" height="10"/>
    <use href="#star" x="262" y="214" width="10" height="10"/>
  </g>

  <!-- a bot's squad (⬢): its symbol, no glow; its leader chases a creep with a hostile sign -->
  <g stroke="#0d0f12" stroke-width="1.5">
    <rect x="560" y="200" width="18" height="18" fill="#ff8c42"/>
    <circle cx="600" cy="180" r="9" fill="#ff8c42"/>
    <circle cx="604" cy="236" r="9" fill="#ff8c42"/>
  </g>
  <use href="#hex" x="574" y="192" width="10" height="10"/>
  <use href="#hex" x="606" y="170" width="10" height="10"/>
  <use href="#hex" x="610" y="226" width="10" height="10"/>
  <path d="M556 209L474 314" stroke="#ff5d5d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- the red sword over the aggressor (slice R) -->
  <g transform="translate(569 178) rotate(45)">
    <rect x="-1.5" y="-13" width="3" height="16" fill="#ff5d5d"/>
    <rect x="-6" y="3" width="12" height="2.5" fill="#ff5d5d"/>
    <rect x="-1.5" y="5" width="3" height="5" fill="#ff5d5d"/>
  </g>
  <!-- the target: a loaded blue gatherer on the road -->
  <circle cx="466" cy="320" r="9" fill="#4ea8ff" stroke="#7fdba0" stroke-width="3"/>

  <!-- the panel (C): the squad on top, numbered, then the rest of the team -->
  <rect x="692" y="16" width="252" height="388" rx="8" fill="#1a1d23" stroke="#333844"/>
  <use href="#star" x="706" y="30" width="14" height="14"/>
  <rect x="728" y="32" width="70" height="10" rx="3" fill="#8b92a1" opacity="0.5"/>
  <g font-size="13" fill="#e6e8ec">
    <g transform="translate(0 0)">
      <rect x="700" y="54" width="236" height="30" rx="5" fill="#22262e" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="712" y="74" fill="#ffd166" font-weight="700">1</text>
      <path d="M742 69L730 62L730 76z" fill="#4ea8ff"/>
      <rect x="752" y="64" width="54" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="66" width="86" height="5" rx="2" fill="#7fdba0"/>
    </g>
    <g>
      <rect x="700" y="88" width="236" height="30" rx="5" fill="#22262e"/>
      <text x="712" y="108" fill="#8b92a1" font-weight="700">2</text>
      <rect x="730" y="96" width="12" height="12" fill="#4ea8ff"/>
      <rect x="752" y="98" width="46" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="100" width="70" height="5" rx="2" fill="#7fdba0"/>
    </g>
    <g>
      <rect x="700" y="122" width="236" height="30" rx="5" fill="#22262e"/>
      <text x="712" y="142" fill="#8b92a1" font-weight="700">3</text>
      <rect x="730" y="130" width="12" height="12" fill="#4ea8ff"/>
      <rect x="752" y="132" width="60" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="134" width="86" height="5" rx="2" fill="#7fdba0"/>
    </g>
    <g>
      <rect x="700" y="156" width="236" height="30" rx="5" fill="#22262e"/>
      <text x="712" y="176" fill="#8b92a1" font-weight="700">4</text>
      <path d="M742 171L730 164L730 178z" fill="#4ea8ff"/>
      <rect x="752" y="166" width="40" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="168" width="52" height="5" rx="2" fill="#ffd166"/>
    </g>
    <g>
      <rect x="700" y="190" width="236" height="30" rx="5" fill="#22262e"/>
      <text x="712" y="210" fill="#8b92a1" font-weight="700">5</text>
      <path d="M742 205L730 198L730 212z" fill="#4ea8ff"/>
      <rect x="752" y="200" width="56" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="202" width="86" height="5" rx="2" fill="#7fdba0"/>
    </g>
    <g>
      <rect x="700" y="224" width="236" height="30" rx="5" fill="#22262e"/>
      <text x="712" y="244" fill="#8b92a1" font-weight="700">6</text>
      <circle cx="736" cy="239" r="6" fill="#4ea8ff"/>
      <rect x="752" y="234" width="48" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="236" width="86" height="5" rx="2" fill="#7fdba0"/>
    </g>
    <g>
      <rect x="700" y="258" width="236" height="30" rx="5" fill="#22262e"/>
      <text x="712" y="278" fill="#8b92a1" font-weight="700">7</text>
      <circle cx="736" cy="273" r="6" fill="#4ea8ff"/>
      <rect x="752" y="268" width="52" height="8" rx="3" fill="#8b92a1" opacity="0.55"/>
      <rect x="836" y="270" width="64" height="5" rx="2" fill="#7fdba0"/>
    </g>
    <path d="M704 300H932" stroke="#333844"/>
    <g opacity="0.55">
      <rect x="700" y="310" width="236" height="26" rx="5" fill="#22262e"/>
      <circle cx="736" cy="323" r="6" fill="#4ea8ff" stroke="#7fdba0" stroke-width="2"/>
      <rect x="752" y="319" width="50" height="8" rx="3" fill="#8b92a1"/>
      <rect x="700" y="340" width="236" height="26" rx="5" fill="#22262e"/>
      <rect x="730" y="347" width="12" height="12" fill="#4ea8ff"/>
      <rect x="752" y="349" width="38" height="8" rx="3" fill="#8b92a1"/>
      <rect x="700" y="370" width="236" height="26" rx="5" fill="#22262e"/>
      <path d="M742 383L730 376L730 390z" fill="#4ea8ff"/>
      <rect x="752" y="379" width="44" height="8" rx="3" fill="#8b92a1"/>
    </g>
  </g>
</svg>
