<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Concept for slice E, siege and repair: it has not had its design round. Only what GDD 01 already decides is drawn:
       the core, finished roads and road jobs have HP and can be destroyed; HP only comes back through paid repair. -->
  <defs>
    <pattern id="jungle" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#16241c"/>
      <path d="M20 0H0V20" fill="none" stroke="#21352a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="360" fill="#111317"/>
  <rect x="16" y="16" width="928" height="328" rx="6" fill="url(#jungle)" stroke="#4a4e57"/>
  <rect x="16" y="10" width="96" height="22" rx="11" fill="#ffd166"/>
  <text x="64" y="25.5" text-anchor="middle" font-size="12" font-weight="700" fill="#111317" letter-spacing="1">MOCK-UP</text>

  <!-- roads out of the Blue core -->
  <path d="M300 180H640" stroke="#b8a07a" stroke-width="20"/>
  <path d="M300 180V320" stroke="#b8a07a" stroke-width="20"/>
  <!-- a damaged road stretch -->
  <path d="M520 170L530 180L522 190M560 170L552 182L562 190" stroke="#6b5a40" stroke-width="2.5" fill="none"/>
  <rect x="512" y="150" width="56" height="5" rx="2" fill="#333844"/>
  <rect x="512" y="150" width="20" height="5" rx="2" fill="#ff5d5d"/>
  <!-- a road job in progress, under attack -->
  <rect x="650" y="170" width="20" height="20" fill="none" stroke="#b8a07a" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="640" y="150" width="40" height="5" rx="2" fill="#333844"/>
  <rect x="640" y="150" width="24" height="5" rx="2" fill="#ffd166"/>

  <!-- the Blue core and its HP -->
  <path d="M286 146L314 146L334 166L334 194L314 214L286 214L266 194L266 166z" fill="#0d0f12" stroke="#4ea8ff" stroke-width="4"/>
  <circle cx="300" cy="180" r="12" fill="none" stroke="#4ea8ff" stroke-width="2"/>
  <rect x="240" y="116" width="120" height="9" rx="3" fill="#333844"/>
  <rect x="240" y="116" width="70" height="9" rx="3" fill="#ffd166"/>

  <!-- the Orange attackers -->
  <g stroke="#0d0f12" stroke-width="1.5">
    <rect x="352" y="140" width="18" height="18" fill="#ff8c42"/>
    <rect x="352" y="200" width="18" height="18" fill="#ff8c42"/>
    <path d="M386 112L404 102L404 122z" fill="#ff8c42"/>
    <circle cx="420" cy="232" r="9" fill="#ff8c42"/>
    <circle cx="590" cy="130" r="9" fill="#ff8c42"/>
    <path d="M700 180L718 170L718 190z" fill="#ff8c42"/>
  </g>
  <g stroke="#ff8c42" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7">
    <path d="M412 228L336 196"/><path d="M582 136L552 168"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ff9b9b">
    <text x="372" y="134">−40</text><text x="330" y="244">−12</text><text x="548" y="140">−12</text><text x="684" y="164">−30</text>
  </g>

  <!-- a Blue defender on its way, and a repair paid from the stock -->
  <g stroke="#0d0f12" stroke-width="1.5">
    <rect x="160" y="171" width="18" height="18" fill="#4ea8ff"/>
    <path d="M150 260L132 250L132 270z" fill="#4ea8ff"/>
  </g>
  <path d="M184 180H244" stroke="#4ea8ff" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
  <g transform="translate(860 70)">
    <rect x="-64" y="-26" width="128" height="52" rx="6" fill="#1a1d23" stroke="#333844"/>
    <path d="M-44 -6L-36 2L-24 -12" stroke="#7fdba0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-10 -12.5L-4.4 -9.25V-2.75L-10 0.5L-15.6 -2.75V-9.25z" fill="#7fdba0"/>
    <text x="0" y="-1" font-size="13" fill="#e6e8ec"> −300</text>
    <rect x="-44" y="10" width="88" height="5" rx="2" fill="#333844"/>
    <rect x="-44" y="10" width="60" height="5" rx="2" fill="#7fdba0"/>
  </g>
</svg>
